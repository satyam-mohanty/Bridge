# GitHub Actions workflow for macOS Bridge App
# Automates generating the Xcode project via XcodeGen, building the application, and running unit tests.

name: macOS Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          which xcodegen || brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd mac
          xcodegen generate

      - name: Build macOS App
        run: |
          xcodebuild -project mac/Bridge.xcodeproj \
            -scheme Bridge \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE="Manual" \
            build

      - name: Run Unit Tests
        run: |
          xcodebuild -project mac/Bridge.xcodeproj \
            -scheme Bridge \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE="Manual" \
            test
